name: Bug report
description: Report reproducible playback behavior
body:
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device, Android version, codec and video resolution }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Expected and actual result }
    validations: { required: true }
